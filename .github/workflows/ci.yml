name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      run_full_pipeline:
        description: "Run full automated pipeline and test suite"
        required: false
        default: true
        type: boolean

jobs:
  test:
    name: Run Test Suite & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pyarrow

      - name: Compile Syntax Check
        run: |
          python -m py_compile scraper.py train_model.py predict.py app.py

      - name: Run Pytest Suite
        run: |
          pytest tests/test_pipeline.py -v

