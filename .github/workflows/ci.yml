name: Pipeline & CI Workflow

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      stages:
        description: "Pipeline stages to execute (e.g. partition,parquet,test or all)"
        required: false
        default: "partition,parquet,test"
        type: string
      train_epochs:
        description: "Training epochs if retraining neural model"
        required: false
        default: "2"
        type: string
      max_samples:
        description: "Max samples for model retraining"
        required: false
        default: "3000"
        type: string

permissions:
  contents: read

jobs:
  pipeline:
    name: Build, Test & Pipeline Workflow
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Syntax Check
        run: |
          python -m py_compile app.py scraper.py train_model.py predict.py workflow.py tests/test_pipeline.py

      - name: Run Pytest Test Suite
        run: |
          pytest tests/test_pipeline.py -v

      - name: Run Pipeline Workflow
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: |
          python workflow.py --stages partition,parquet,test

      - name: Run Custom Pipeline Workflow (Manual Dispatch)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          python workflow.py --stages "${{ inputs.stages }}" --epochs "${{ inputs.train_epochs }}" --max-samples "${{ inputs.max_samples }}"

      - name: Upload Workflow Telemetry Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-history
          path: data/workflow_history.json
          if-no-files-found: ignore
