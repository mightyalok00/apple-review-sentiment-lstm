version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apple_review_sentiment_dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - PORT=8501
      - TF_ENABLE_ONEDNN_OPTS=0
      - PYTHONHASHSEED=42
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M
